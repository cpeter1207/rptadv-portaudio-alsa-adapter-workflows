name: Required quality

on:
  workflow_call:
    inputs:
      code_ref:
        description: Exact adapter-source revision to validate; empty uses the caller revision.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  independent:
    name: Platform-independent checks
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rptadv-portaudio-alsa-adapter-quality:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rptadv-portaudio-alsa-adapter
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Check formatting, analysis, and documentation concurrently
        run: make -j3 quality

  platforms:
    needs: independent
    name: Debian 13 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ghcr.io/cpeter1207/rptadv-portaudio-alsa-adapter-quality:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rptadv-portaudio-alsa-adapter
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Verify native target architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
      - name: Build, test, package, and stage installation
        run: make platform-verify
      - name: Verify production coverage
        if: matrix.arch == 'amd64'
        run: make coverage
      - name: Upload amd64 coverage evidence
        if: always() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-debian13-amd64
          path: build/coverage
          if-no-files-found: error

  required:
    name: Required quality gate
    if: always()
    needs: [independent, platforms]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          INDEPENDENT: ${{ needs.independent.result }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: test "$INDEPENDENT" = success && test "$PLATFORMS" = success
