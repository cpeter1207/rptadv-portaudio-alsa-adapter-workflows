name: Publish documentation

on:
  workflow_call:
    inputs:
      code_ref:
        description: Immutable adapter-source revision whose API documentation is published.
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  documentation:
    name: Build and publish API documentation
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rptadv-portaudio-alsa-adapter-quality:latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rptadv-portaudio-alsa-adapter
          ref: ${{ inputs.code_ref }}
      - name: Build warning-free API documentation
        run: make docs
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/doxygen/html
      - uses: actions/deploy-pages@v5
        id: publish
