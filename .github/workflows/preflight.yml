name: Fast quality

on:
  workflow_call:
    inputs:
      code_ref:
        description: Exact adapter-source revision to check; empty uses the caller revision.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  preflight:
    name: Fast quality
    runs-on: ubuntu-24.04
    container: ghcr.io/cpeter1207/rptadv-portaudio-alsa-adapter-quality:latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: cpeter1207/rptadv-portaudio-alsa-adapter
          ref: ${{ inputs.code_ref || github.sha }}
      - name: Install released capture ring dependencies
        shell: bash
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          packages="$(mktemp -d)"
          trap 'rm -rf "$packages"' EXIT
          base=https://github.com/cpeter1207
          curl -fLsS "$base/rptadv-samplerate-adapter/releases/download/v0.1.0-alpha.1/librptadv-samplerate-adapter1_0.1.0.alpha1-1_$arch.deb" -o "$packages/samplerate.deb"
          curl -fLsS "$base/rate_adjusting_pcm_ring/releases/download/v2.0.0-alpha.1/librate-adjusting-pcm-ring2_2.0.0.alpha1-1_$arch.deb" -o "$packages/ring.deb"
          curl -fLsS "$base/rate_adjusting_pcm_ring/releases/download/v2.0.0-alpha.1/librate-adjusting-pcm-ring2-dev_2.0.0.alpha1-1_$arch.deb" -o "$packages/ring-dev.deb"
          apt-get update
          apt-get install -y --no-install-recommends "$packages"/*.deb
      - name: Check formatting, lint, and static analysis
        run: make -j3 lint static-analysis
